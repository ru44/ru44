name: rotate-portrait

# Shows a different animated portrait at the top of the profile every week.
on:
  schedule:
    - cron: "0 0 * * 1" # Mondays, 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pick this week's portrait
        id: pick
        run: |
          portraits=(glitch terminal decrypt)
          week=$((10#$(date -u +%V)))
          pick=${portraits[$((week % ${#portraits[@]}))]}
          cp "assets/portraits/$pick.svg" assets/portrait.svg
          echo "name=$pick" >> "$GITHUB_OUTPUT"

      - name: Commit the change
        run: |
          if git diff --quiet; then
            echo "Already showing the ${{ steps.pick.outputs.name }} portrait."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: show the ${{ steps.pick.outputs.name }} portrait this week"
          git push
